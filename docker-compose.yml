# Local development infrastructure only — never used in production.
# Start with: docker compose up -d
# Stop with:  docker compose down          (add -v to also wipe local data volumes)

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
      POSTGRES_DB: memora_dev
    ports:
      # Mapped to 5433 on the host, not the default 5432 — this machine has
      # a native (non-Docker) PostgreSQL service already bound to 5432,
      # which silently intercepts host connections meant for this container
      # (docker exec into the container still works fine on 5432 internally;
      # only host->container connections collide). Update DATABASE_URL in
      # apps/api/.env to match if you change this.
      - "5433:5432"
    volumes:
      - memora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - memora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memora_postgres_data:
  memora_redis_data:
