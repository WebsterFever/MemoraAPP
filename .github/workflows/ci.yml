name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://memora:memora@localhost:5432/memora_ci
  REDIS_URL: redis://localhost:6379

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/api prisma:generate
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/api prisma:generate
      - run: pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/api prisma:generate
      - run: pnpm --filter @memora/api test
      - run: pnpm --filter @memora/api test:e2e

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/mobile test

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/api prisma:generate
      - run: pnpm --filter @memora/api build

  build-mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/mobile build

  phase1-stack-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memora
          POSTGRES_PASSWORD: memora
          POSTGRES_DB: memora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memora -d memora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memora/api prisma:generate
      - name: Apply committed Prisma migrations
        run: pnpm --filter @memora/api exec prisma migrate deploy
      - name: Verify pgvector extension
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U memora -d memora_ci -tAc "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -qx vector
      - name: Build API
        run: pnpm --filter @memora/api build
      - name: Start API and verify live database health
        run: |
          pnpm --filter @memora/api start:prod > /tmp/memora-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true; cat /tmp/memora-api.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":"up"' /tmp/health.json
